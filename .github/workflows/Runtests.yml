name: Runtests

on:
  push:
    branches:
      - 'master'
    tags: '*'
  pull_request:

env:
  JULIA_NUM_THREADS: 4

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout-minutes }}

    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1']
        julia-arch: [x64]
        os: [ubuntu-latest]
        timeout-minutes: [120]

        include:
          - julia-version: '1'
            julia-arch: x86
            os: ubuntu-latest
            timeout-minutes: 360

          - julia-version: '1'
            julia-arch: aarch64
            os: macOS-latest
            timeout-minutes: 120

          - julia-version: '1'
            julia-arch: x64
            os: windows-latest
            timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # Julia x86 on Ubuntu needs the i386 loader/libs or spawn fails / hangs oddly.
      - name: Install 32-bit runtime libraries (i386)
        if: matrix.julia-arch == 'x86' && runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386 libgfortran5:i386

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}

      - name: Show Julia architecture
        run: julia -e 'println("Julia ", VERSION, ", ", Sys.WORD_SIZE, "-bit, Int = ", Int)'

      - uses: actions/cache@v4
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-${{ matrix.julia-arch }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.julia-arch }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-${{ matrix.julia-arch }}-test-

      - uses: julia-actions/julia-buildpkg@latest

      - uses: julia-actions/julia-runtest@latest
        with:
          depwarn: error

      - uses: julia-actions/julia-processcoverage@v1

      - uses: codecov/codecov-action@v5
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
