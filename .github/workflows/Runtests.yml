name: Runtests

on:
  push:
    branches:
      - 'master'
    tags: '*'
  pull_request:

env:
  JULIA_NUM_THREADS: 4

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1']
        julia-arch: [x64]
        os: [ubuntu-latest]

        include:
          # One additional 32-bit Linux job
          - julia-version: '1'
            julia-arch: x86
            os: ubuntu-latest

          # Add Windows and macOS jobs
          - julia-version: '1'
            julia-arch: x64
            os: macOS-latest

          - julia-version: '1'
            julia-arch: x64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}

      - name: Show Julia architecture
        run: julia -e 'println("Julia ", VERSION, ", ", Sys.WORD_SIZE, "-bit, Int = ", Int)'

      - uses: actions/cache@v4
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-${{ matrix.julia-arch }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.julia-arch }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-${{ matrix.julia-arch }}-test-

      - uses: julia-actions/julia-buildpkg@latest

      - uses: julia-actions/julia-runtest@latest
        with:
          depwarn: error

      - uses: julia-actions/julia-processcoverage@v1

      - uses: codecov/codecov-action@v5
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true